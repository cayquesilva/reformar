# Ambiente LOCAL de desenvolvimento e testes. Não use estas credenciais em produção.
services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: reformar
      POSTGRES_PASSWORD: reformar_dev
      POSTGRES_DB: reformar
    ports:
      - "5433:5432"
    volumes:
      - reformar-db:/var/lib/postgresql/data
      - ./infra/postgres-init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reformar -d reformar"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  reformar-db:
